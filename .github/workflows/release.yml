name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, for example 0.1.0-rc.1'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validation dependencies
        run: python -m pip install --upgrade pip PyYAML jsonschema reportlab
      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            TAG="${{ github.event.release.tag_name }}"
            VERSION="${TAG#v}"
          else
            VERSION="${{ inputs.version }}"
          fi
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Run full validation suite
        run: python scripts/run_ci.py --project-root . --reports-dir dist/ci-reports
      - name: Build distributions
        run: python scripts/build_distributions.py --project-root . --output-dir dist --version "${{ steps.version.outputs.version }}"
      - name: Validate distributions
        run: python scripts/validate_distributions.py --project-root . --output-dir dist --version "${{ steps.version.outputs.version }}"
      - name: Upload release build as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: metamodel-builder-${{ steps.version.outputs.version }}
          path: dist/
          if-no-files-found: error
      - name: Upload files to published GitHub release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            dist/metamodel-builder-project-${{ steps.version.outputs.version }}.zip \
            dist/metamodel-builder-chat-${{ steps.version.outputs.version }}.zip \
            dist/metamodel-builder-custom-gpt-${{ steps.version.outputs.version }}.zip \
            dist/metamodel-builder-opencode-${{ steps.version.outputs.version }}.zip \
            dist/release-manifest.json \
            dist/runtime-parity.json \
            dist/SHA256SUMS.txt \
            --clobber
