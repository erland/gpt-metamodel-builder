name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, for example 0.1.0-rc.1'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validation dependencies
        run: python -m pip install --upgrade pip PyYAML jsonschema reportlab
      - name: Resolve version
        id: version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "release" ]]; then
            [[ "$RELEASE_TAG" == v* ]] || { echo "Release tag must begin with v"; exit 1; }
            VERSION="${RELEASE_TAG#v}"
          else
            VERSION="$REQUESTED_VERSION"
          fi
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]] || { echo "Invalid release version"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Run domain regression gates
        run: python scripts/run_ci.py --project-root . --reports-dir dist/ci-reports
      - name: Download and verify pinned original engine
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            --output /tmp/gpt-byggaren-engine-1.6.33.zip \
            https://github.com/erland/gpt-byggaren/releases/download/v1.6.33/gpt-byggaren-engine-1.6.33.zip
          echo "9638ce2b9300423ace6c055ef824284154788d9d8e6e54459f875fe56ff69885  /tmp/gpt-byggaren-engine-1.6.33.zip" | sha256sum --check
          mkdir -p /tmp/gpt-byggaren-engine
          python -m zipfile -e /tmp/gpt-byggaren-engine-1.6.33.zip /tmp/gpt-byggaren-engine
      - name: Self-test original engine
        run: |
          python /tmp/gpt-byggaren-engine/scripts/selftest_distribution_engine.py --source /tmp/gpt-byggaren-engine --output "$RUNNER_TEMP/engine-selftest.json"
      - name: Install canonical engine
        run: |
          python /tmp/gpt-byggaren-engine/scripts/install_distribution_engine.py --source /tmp/gpt-byggaren-engine --project-root .
      - name: Lint, build and validate canonical distributions
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          python scripts/lint_gpt_project.py --project-root .
          python scripts/build_distributions.py --project-root . --version "$VERSION"
          python scripts/validate_distributions.py --project-root .
          test -s dist/metamodel-builder-engine-*.zip
          mkdir -p "$RUNNER_TEMP/metamodel-domain-engine"
          python -m zipfile -e dist/metamodel-builder-engine-*.zip "$RUNNER_TEMP/metamodel-domain-engine"
          python "$RUNNER_TEMP/metamodel-domain-engine/scripts/selftest_metamodel_engine.py" --json-out "$RUNNER_TEMP/metamodel-engine-selftest.json"
          python scripts/test_runtime_archive_parity.py --dist dist
          python scripts/test_mmp_distribution_archives.py --dist dist
          python scripts/test_mmp_skill_direct_execution.py --dist dist
          # Preserve the historical 1.1.0 kit (MMP format 1.0.0).
          LEGACY_KIT_NAME="$(python scripts/build_mmp_specification.py --print-filename)"
          python scripts/build_mmp_specification.py --output "dist/$LEGACY_KIT_NAME"
          python scripts/test_mmp_specification_kit.py --archive "dist/$LEGACY_KIT_NAME"
          python scripts/test_mmp_release_kit.py --kit "dist/$LEGACY_KIT_NAME"
          (cd dist && sha256sum "$LEGACY_KIT_NAME" >> SHA256SUMS.txt)
          sha256sum "dist/$LEGACY_KIT_NAME" > "dist/$LEGACY_KIT_NAME.sha256"
          # Publish the separate new kit only after its actual artifact passes.
          MMP_KIT_NAME="$(python scripts/build_mmp_specification_1_2.py --print-filename)"
          MMP_KIT_PATH="dist/$MMP_KIT_NAME"
          python scripts/build_mmp_specification_1_2.py --output "$MMP_KIT_PATH"
          (cd dist && sha256sum "$MMP_KIT_NAME" > "$MMP_KIT_NAME.sha256")
          python scripts/verify_mmp_11_release_artifact.py --kit "$MMP_KIT_PATH" --sha256-file "$MMP_KIT_PATH.sha256" --report "$RUNNER_TEMP/mmp11-release-evidence.json"
          (cd dist && sha256sum "$MMP_KIT_NAME" >> SHA256SUMS.txt)
          echo "MMP_KIT_PATH=$MMP_KIT_PATH" >> "$GITHUB_ENV"
          python - <<'PY'
          import shutil, subprocess, sys, tempfile
          from pathlib import Path
          with tempfile.TemporaryDirectory() as tmp:
              base = Path(tmp)
              shutil.copytree('examples/architecture-lite', base/'external-model')
              shutil.copytree('workspace', base/'external-workspace')
              for script, flag, target in [
                  ('validate_canonical_schema.py', '--model-dir', 'external-model'),
                  ('validate_workspace.py', '--workspace-dir', 'external-workspace'),
              ]:
                  subprocess.run([sys.executable, 'scripts/'+script, flag, str(base/target)], check=True)
          PY
          for runtime in project chat claude-project claude-skills opencode plugin; do
            test -s "dist/metamodel-builder-${runtime}-${VERSION}.zip"
          done
          test -s "$MMP_KIT_PATH"
          test -s "$MMP_KIT_PATH.sha256"
          test -s dist/DELIVERY-MANIFEST.json
          (cd dist && sha256sum --check SHA256SUMS.txt)
      - name: Upload distributions, MMP kit and checksums
        uses: actions/upload-artifact@v4
        with:
          name: metamodel-builder-${{ steps.version.outputs.version }}
          path: |
            dist/metamodel-builder-*.zip
            dist/mmp-specification-kit-*.zip
            dist/mmp-specification-kit-*.zip.sha256
            dist/DELIVERY-MANIFEST.json
            dist/SHA256SUMS.txt
          if-no-files-found: error
      - name: Attach verified distributions to published release
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" dist/metamodel-builder-*.zip dist/mmp-specification-kit-*.zip dist/mmp-specification-kit-*.zip.sha256 dist/DELIVERY-MANIFEST.json dist/SHA256SUMS.txt --clobber
