name: GPT Byggaren engine 1.6.31 preflight

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  engine-preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validator dependencies
        run: python -m pip install PyYAML jsonschema
      - name: Download pinned original engine archive
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            --output /tmp/gpt-byggaren-engine-1.6.31.zip \
            https://github.com/erland/gpt-byggaren/releases/download/v1.6.31/gpt-byggaren-engine-1.6.31.zip
          echo "d8b9938e9e008415ee46eeb699d7520c2b7354a39f07f40fcac1fb6adc819e70  /tmp/gpt-byggaren-engine-1.6.31.zip" | sha256sum --check
      - name: Unpack original engine
        shell: bash
        run: |
          mkdir -p /tmp/gpt-byggaren-engine
          python -m zipfile -e /tmp/gpt-byggaren-engine-1.6.31.zip /tmp/gpt-byggaren-engine
      - name: Run original engine self-test
        shell: bash
        run: |
          python /tmp/gpt-byggaren-engine/scripts/selftest_distribution_engine.py \
            --source /tmp/gpt-byggaren-engine \
            --output "$RUNNER_TEMP/engine-selftest.json"
      - name: Install original engine and build migrated project
        shell: bash
        run: |
          set -euo pipefail
          python /tmp/gpt-byggaren-engine/scripts/install_distribution_engine.py --source /tmp/gpt-byggaren-engine --project-root .
          python scripts/lint_gpt_project.py --project-root .
          python scripts/build_distributions.py --project-root . --version "0.1.0-ci.${GITHUB_RUN_NUMBER}"
          python scripts/validate_distributions.py --project-root . --version "0.1.0-ci.${GITHUB_RUN_NUMBER}"
      - name: Upload candidate distributions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metamodel-builder-engine-1.6.31-candidates
          path: dist/
          if-no-files-found: warn
      - name: Upload engine preflight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpt-byggaren-engine-1.6.31-preflight
          path: ${{ runner.temp }}/engine-selftest.json
          if-no-files-found: warn
