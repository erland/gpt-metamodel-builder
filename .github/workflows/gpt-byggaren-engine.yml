name: GPT Byggaren engine 1.6.33 preflight

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  engine-preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validator dependencies
        run: python -m pip install PyYAML jsonschema
      - name: Download pinned original engine archive
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            --output /tmp/gpt-byggaren-engine-1.6.33.zip \
            https://github.com/erland/gpt-byggaren/releases/download/v1.6.33/gpt-byggaren-engine-1.6.33.zip
          echo "9638ce2b9300423ace6c055ef824284154788d9d8e6e54459f875fe56ff69885  /tmp/gpt-byggaren-engine-1.6.33.zip" | sha256sum --check
      - name: Unpack original engine
        shell: bash
        run: |
          mkdir -p /tmp/gpt-byggaren-engine
          python -m zipfile -e /tmp/gpt-byggaren-engine-1.6.33.zip /tmp/gpt-byggaren-engine
      - name: Run original engine self-test
        shell: bash
        run: |
          python /tmp/gpt-byggaren-engine/scripts/selftest_distribution_engine.py \
            --source /tmp/gpt-byggaren-engine \
            --output "$RUNNER_TEMP/engine-selftest.json"
      - name: Install original engine and build migrated project
        shell: bash
        run: |
          set -euo pipefail
          python /tmp/gpt-byggaren-engine/scripts/install_distribution_engine.py --source /tmp/gpt-byggaren-engine --project-root .
          python scripts/lint_gpt_project.py --project-root .
          python scripts/build_distributions.py --project-root . --version "0.1.0-ci.${GITHUB_RUN_NUMBER}"
          python scripts/validate_distributions.py --project-root .
          test -s dist/metamodel-builder-engine-*.zip
          mkdir -p "$RUNNER_TEMP/metamodel-domain-engine"
          python -m zipfile -e dist/metamodel-builder-engine-*.zip "$RUNNER_TEMP/metamodel-domain-engine"
          python "$RUNNER_TEMP/metamodel-domain-engine/scripts/selftest_metamodel_engine.py" --json-out "$RUNNER_TEMP/metamodel-engine-selftest.json"
          python scripts/test_runtime_archive_parity.py --dist dist
          python scripts/test_mmp_distribution_archives.py --dist dist
          python scripts/test_mmp_skill_direct_execution.py --dist dist
          python scripts/build_mmp_specification.py --output dist/mmp-specification-1.0.0.zip
          python scripts/test_mmp_specification_kit.py --archive dist/mmp-specification-1.0.0.zip
          python - <<'PY'
          import shutil, subprocess, sys, tempfile
          from pathlib import Path
          with tempfile.TemporaryDirectory() as tmp:
              base = Path(tmp)
              shutil.copytree('examples/architecture-lite', base/'external-model')
              shutil.copytree('workspace', base/'external-workspace')
              for script, flag, target in [
                  ('validate_canonical_schema.py', '--model-dir', 'external-model'),
                  ('validate_workspace.py', '--workspace-dir', 'external-workspace'),
              ]:
                  subprocess.run([sys.executable, 'scripts/'+script, flag, str(base/target)], check=True)
          PY
      - name: Upload candidate distributions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metamodel-builder-engine-1.6.31-candidates
          path: dist/
          if-no-files-found: warn
      - name: Upload engine preflight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpt-byggaren-engine-1.6.33-preflight
          path: ${{ runner.temp }}/engine-selftest.json
          if-no-files-found: warn
