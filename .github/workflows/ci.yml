name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validation dependencies
        run: python -m pip install --upgrade pip PyYAML jsonschema reportlab
      - name: Check five-runtime migration target contract
        run: python scripts/test_runtime_migration_contract.py
      - name: Run full validation suite
        run: python scripts/run_ci.py --project-root . --reports-dir dist/ci-reports
      # Runtime distribution build is performed by pinned engine workflow.
      # Legacy release script still expects Custom GPT and is deliberately not invoked.
      - name: Upload CI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: metamodel-builder-ci-${{ github.run_number }}
          path: dist/
          if-no-files-found: warn
