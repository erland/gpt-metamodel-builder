name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validation dependencies
        run: python -m pip install --upgrade pip PyYAML jsonschema reportlab
      - name: Run full validation suite
        run: python scripts/run_ci.py --project-root . --reports-dir dist/ci-reports
      - name: Build distributions
        run: python scripts/build_distributions.py --project-root . --output-dir dist --version "0.1.0-ci.${GITHUB_RUN_NUMBER}"
      - name: Validate distributions
        run: python scripts/validate_distributions.py --project-root . --output-dir dist --version "0.1.0-ci.${GITHUB_RUN_NUMBER}"
      - name: Upload CI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: metamodel-builder-ci-${{ github.run_number }}
          path: dist/
          if-no-files-found: error
