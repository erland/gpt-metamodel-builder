name: MMP TypeScript interoperability
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  typescript-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install PyYAML jsonschema
      - run: echo "MMP_KIT_PATH=/tmp/$(python scripts/build_mmp_specification.py --print-filename)" >> "$GITHUB_ENV"
      - run: python scripts/build_mmp_specification.py --output "$MMP_KIT_PATH"
      - run: python scripts/test_mmp_release_kit.py --kit "$MMP_KIT_PATH" --json-out /tmp/mmp-release-report.json
      - run: npm install --no-audit --no-fund
        working-directory: interop/typescript
      - run: npm run build
        working-directory: interop/typescript
      - run: node interop/typescript/dist/conformance.js "$MMP_KIT_PATH"
      - run: python scripts/test_mmp_effective_pairs_package.py --typescript
      - run: python scripts/test_mmp_relation_inheritance_package.py --typescript
      - run: python scripts/test_mmp_typed_endpoints_package.py --typescript
      - run: python scripts/test_mmp_package_semantics.py "$MMP_KIT_PATH"
      - run: node interop/typescript/dist/package-semantic-test.js "$MMP_KIT_PATH"
      - run: python scripts/test_mmp_strict_package_profile.py "$MMP_KIT_PATH"
      - run: node interop/typescript/dist/strict-package-test.js "$MMP_KIT_PATH"
      - run: python scripts/test_mmp_effective_properties.py
      - run: node interop/typescript/dist/effective-properties-test.js interop/effective-properties-v1.json
      - run: node interop/typescript/dist/cardinality-test.js interop/cardinality-v1.json
      - run: node interop/typescript/dist/default-values-test.js interop/default-values-v1.json
      - run: node interop/typescript/dist/relationship-test.js interop/relationship-semantics-v1.json
      - run: node interop/typescript/dist/version-extension-test.js interop/version-extension-v1.json
      - run: node interop/typescript/dist/relation-inheritance-test.js interop/relationship-inheritance-v1.json
      - run: node interop/typescript/dist/required-policy-test.js interop/required-policy-v1.json
      - run: node interop/typescript/dist/canonical-value-test.js interop/canonical-values-v1.json
      - run: node interop/typescript/dist/extension-negotiation-test.js interop/extension-negotiation-v1.json
      - run: python scripts/run_mmp_core_semantic_suite.py --typescript --json-out /tmp/mmp-core-semantic-report.json
