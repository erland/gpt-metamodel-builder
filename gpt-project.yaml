schema_version: 1
project:
  id: metamodel-builder
  name: Metamodel Builder
  description: Verktygsneutral GPT för att skapa, underhålla, validera och exportera
    metamodeller, med Sparx EA MDG som första målplattform.
  version_source: development
structure:
  canonical_root: canonical
  instructions:
    path: canonical
    required: true
  conversation_starters:
    path: assistant/conversation-starters
    required: false
  runtime_policy:
    path: assistant/policies
    required: false
  schemas:
    path: schemas
    required: true
  templates:
    path: templates
    required: false
  scripts:
    path: scripts
    required: true
  tests:
    path: tests
    required: false
  evals:
    path: evals
    required: false
  build:
    path: build
    generated: true
  dist:
    path: dist
    generated: true
knowledge_architecture:
  canonical_root: knowledge
profile:
  reference: zip_first_advanced
  rationale: Projektet kräver portabelt workspace, schemas, deterministisk validering,
    filgenerering och flera runtime-adaptrar.
analysis:
  recommended_profile: zip_first_advanced
  runtime:
    strategy: peer_candidates
    candidates:
    - runtime_id: chatgpt_chat
      suitability: equivalent
      rationale: ZIP/workspace, filanalys och genererade artefakter passar kärnflödet.
      activate_by_default: true
    - runtime_id: claude_project
      suitability: equivalent_runtime_dependent
      rationale: Canonical kontrakt projiceras till Claude Projects; deterministiska verktyg kräver Python-exekvering.
      activate_by_default: true
    - runtime_id: claude_skills
      suitability: equivalent_runtime_dependent
      rationale: Modulära Skills med explicit resursberoenden och hostberoende verktygsexekvering.
      activate_by_default: true
    - runtime_id: opencode
      suitability: equivalent
      rationale: Mycket lämplig för lokalt workspace, valideringsscripts, generatorer
        och Git.
      activate_by_default: true
    - runtime_id: openai_plugin
      suitability: equivalent_runtime_dependent
      rationale: Skills-first runtime kan bära canonical modell, state och deterministiska verktygsresurser när hosten erbjuder persistent writable workspace och kompatibel code execution.
      activate_by_default: true
  capabilities:
    web: recommended
    data_analysis: recommended
    image_generation: not_recommended
    file_handling: required
  project_features:
    structured_knowledge: true
    scripts: true
    schemas: true
    templates: true
    deterministic_tests: true
    evals: required
  model_robustness:
    level: stateful
    rationale: Metamodeller förvaltas över många iterationer och kräver strukturerad
      status, återupptagning, valideringsgates och deterministisk regenerering.
    operational_core: true
    explicit_workflow: true
    deterministic_gates: true
    model_compatibility_evals: true
instructions:
  mode: modular_skills
  canonical: canonical/core.md
  core: canonical/core.md
  core_contract:
    enabled: true
    required_markers:
    - Canonical YAML är sanningskällan.
    - Genererad MDG XML får aldrig bli canonical source.
    - Validera före generering.
    - Läs strukturerad projektstatus före nästa steg.
    required_runtime_dependencies:
    - assistant/policies/workflow.md
    max_required_file_hops: 1
    knowledge_may_not_be_required_for_core_behavior: true
skills:
  contract_version: 1
  schema: schemas/skill-contract.schema.json
  mode: explicit
  resource_policy: explicit
  definitions:
  - id: metamodellering
    name: Metamodellering
    description: Skapa, ändra, validera och versionsjämföra canonical metamodeller.
    source: canonical/skills/metamodellering/behavior.md
    references:
    - docs/canonical-metamodel-v1.md
    - docs/semantic-validation-v1.md
    scripts:
    - scripts/validate_canonical_schema.py
    - scripts/validate_semantics.py
    - scripts/diff_metamodel.py
    - scripts/validate_workspace.py
    - scripts/export_mmp.py
    - scripts/import_mmp.py
    assets:
    - schemas/metamodel.schema.json
    - schemas/properties.schema.json
    - schemas/constraints.schema.json
    - schemas/viewpoints.schema.json
    - schemas/notation.schema.json
    - schemas/provenance.schema.json
    - schemas/version.schema.json
    - schemas/guidance.schema.json
    - schemas/common-definitions.schema.json
    - schemas/mmp-manifest-v1.schema.json
    - templates/metamodel/guidance.yaml
  - id: kallanpassning
    name: Källanpassning
    description: Anpassa metamodeller från källstandarder via godkända transformationsplaner.
    source: canonical/skills/kallanpassning/behavior.md
    references: []
    scripts:
    - scripts/adapt_source_model.py
    assets: []
  - id: sparx-ea
    name: Sparx EA MDG
    description: Importera, mappa, generera och validera Sparx Enterprise Architect MDG.
    source: canonical/skills/sparx-ea/behavior.md
    references:
    - docs/sparx-ea-mapping-v1.md
    - docs/sparx-ea-mdg-generator-v1.md
    - docs/sparx-ea-mdg-import-v1.md
    scripts:
    - scripts/validate_sparx_mapping.py
    - scripts/generate_sparx_mdg.py
    - scripts/validate_generated_mdg.py
    - scripts/import_sparx_mdg.py
    assets: []
  - id: dokumentation
    name: Dokumentation
    description: Generera metamodellreferens, modelleringshandledning och snabbguider.
    source: canonical/skills/dokumentation/behavior.md
    references:
    - docs/modeling-guidance-v1.md
    scripts:
    - scripts/generate_documentation.py
    - scripts/export_documentation.py
    assets: []
engine:
  enabled: true
  release_repository: erland/gpt-metamodel-builder
  selftest: scripts/selftest_metamodel_engine.py
  python_dependencies:
  - PyYAML
  - jsonschema
  - reportlab
  required_files:
  - scripts/selftest_metamodel_engine.py
  - scripts/validate_canonical_schema.py
  - scripts/validate_semantics.py
  - scripts/validate_workspace.py
  - scripts/generate_sparx_mdg.py
  resources:
  - scripts
  - schemas
  - templates
  - examples
  - tests
  - workspace
  - platforms
  - metamodel
  - docs
  - interop
  - gpt-project.yaml
  - project-status.yaml
model_robustness:
  level: stateful
  separate_model_instructions: false
  prefer_deterministic_validation: true
  max_core_policy_hops: 1
workflow:
  mode: explicit_state_machine
  policy: assistant/policies/workflow.md
  operational_core:
  - read_project_contract
  - read_project_status
  - select_one_state_or_bounded_goal
  - load_only_relevant_policy
  - execute_change
  - validate_deterministically
  - correct_before_completion_on_failure
  - update_structured_status_after_pass
  - rebuild_project_zip_when_required
  - recommend_next_step_from_actual_state
  states:
    idea_analysis:
      next:
      - architecture
    architecture:
      next:
      - planning
    planning:
      next:
      - implementation
    implementation:
      next:
      - validation
    validation:
      next:
      - implementation
      - packaging
    packaging:
      next:
      - release
    release:
      next:
      - maintenance
    maintenance:
      next:
      - implementation
      - validation
    blocked:
      next: []
    paused:
      next: []
capabilities:
  contract_version: 1
  schema: schemas/capability-contract.schema.json
  recommendation_mode: inferred_from_use_case
  ask_user_only_when_business_choice_is_ambiguous: true
  requirements:
    web:
      level: recommended
      reason: Behövs för aktuell dokumentation om standarder och verktygsformat när
        användaren vill analysera externa källor.
    filesystem:
      read: required
      write: required
    shell:
      level: recommended
      reason: Behövs i exekverbara runtimes för deterministiska validators och generatorer.
    code_execution:
      level: required
      reason: Schema- och semantisk validering samt senare MDG-generering ska kunna
        köras deterministiskt.
    structured_data:
      level: required
      reason: Canonical metamodell och state lagras strukturerat i YAML/JSON.
    persistent_state:
      level: required
      reason: Projekt ska kunna återupptas utan chatthistorik.
    external_tools:
      level: optional
      reason: Sparx EA används för slutlig praktisk importverifiering när tillgängligt.
      preferred_protocols:
      - file_exchange
    image_generation:
      level: not_required
      reason: Kärnuppgiften är strukturerad modellering och generering, inte bildskapande.
artifacts:
  contract_version: 1
  schema: schemas/artifact-contract.schema.json
  outputs:
    project_package:
      kind: package
      format: zip
      requirement: required
      persistence: persistent
      multiplicity: one
      filename_pattern: metamodel-builder-project.zip
      description: Komplett canonical projektpaket.
    runtime_package:
      kind: distribution
      format: zip
      requirement: conditional
      condition: runtime_enabled
      persistence: persistent
      multiplicity: many
      description: Runtime-specifik distribution härledd från canonical projekt.
    canonical_metamodel:
      kind: data
      format: yaml
      requirement: required
      persistence: persistent
      multiplicity: many
      description: Verktygsneutral metamodell som är sanningskälla.
    sparx_mdg:
      kind: data
      format: xml
      requirement: conditional
      condition: sparx_ea_export_requested
      persistence: persistent
      multiplicity: many
      description: Genererad Sparx EA MDG Technology.
    validation_report:
      kind: report
      format: structured
      requirement: required
      persistence: persistent
      multiplicity: many
    metamodel_reference:
      kind: document
      format: multi
      requirement: conditional
      condition: documentation_requested
      persistence: persistent
      multiplicity: many
      description: Teknisk metamodellreferens i Markdown, Confluence markup eller
        PDF.
    modeling_guide:
      kind: document
      format: multi
      requirement: conditional
      condition: guidance_requested
      persistence: persistent
      multiplicity: many
      description: Praktisk modelleringshandledning i Markdown, Confluence markup
        eller PDF.
    quick_reference:
      kind: document
      format: multi
      requirement: conditional
      condition: guidance_requested
      persistence: persistent
      multiplicity: many
      description: Kort modelleringssnabbguide i Markdown, Confluence markup eller
        PDF.
workspace_state:
  contract_version: 1
  schema: schemas/workspace-state-contract.schema.json
  workspace:
    requirement: required
    persistence: required
    portable: true
    separate_from_assistant: true
    artifact: project_package
    description: Workspace ska vara portabelt och återupptagningsbart från ZIP.
  state:
    requirement: required
    persistence: required
    authority: workspace_file
    format: yaml
    path: project-status.yaml
    conversation_fallback: false
    description: Strukturerad projektstatus är auktoritativ för progression.
  runtime_preferences:
    chatgpt_chat: conversation_or_file
    claude_skills: conversation_or_file
    opencode: workspace_file
    claude_project: conversation_or_file
    openai_plugin: workspace_file
tools:
  contract_version: 1
  schema: schemas/tool-contract.schema.json
  tools:
  - id: validate-canonical-schema
    type: script
    requirement: required
    purpose: Validera canonical YAML mot schemas.
    script: scripts/validate_canonical_schema.py
    deterministic: true
    mutates_workspace: false
    runtime_fallback: manual
  - id: validate-semantics
    type: script
    requirement: required
    purpose: Validera semantiska referenser och regler.
    script: scripts/validate_semantics.py
    deterministic: true
    mutates_workspace: false
    runtime_fallback: manual
  - id: validate-sparx-mapping
    type: script
    requirement: recommended
    purpose: Validera Sparx EA-adaptern mot canonical modell.
    script: scripts/validate_sparx_mapping.py
    deterministic: true
    mutates_workspace: false
    runtime_fallback: manual
  - id: generate-sparx-mdg
    type: script
    requirement: recommended
    purpose: Generera Sparx EA MDG Technology XML.
    script: scripts/generate_sparx_mdg.py
    deterministic: true
    mutates_workspace: true
    runtime_fallback: manual
  - id: validate-generated-mdg
    type: script
    requirement: recommended
    purpose: Validera genererad MDG och Shape Script round-trip.
    script: scripts/validate_generated_mdg.py
    deterministic: true
    mutates_workspace: false
    runtime_fallback: manual
  - id: generate-documentation
    type: script
    requirement: recommended
    purpose: Generera Markdown-dokumentation från canonical modell.
    script: scripts/generate_documentation.py
    deterministic: true
    mutates_workspace: true
    runtime_fallback: manual
  - id: export-documentation
    type: script
    requirement: recommended
    purpose: Exportera metamodellreferens, modelleringshandledning och snabbguide
      till Markdown, Confluence markup och PDF.
    script: scripts/export_documentation.py
    deterministic: true
    mutates_workspace: true
    runtime_fallback: manual
  - id: import-sparx-mdg
    type: script
    requirement: recommended
    purpose: Reverse-engineera Sparx EA MDG till canonical och adapter.
    script: scripts/import_sparx_mdg.py
    deterministic: true
    mutates_workspace: true
    runtime_fallback: manual
  - id: diff-metamodel
    type: script
    requirement: recommended
    purpose: Jämför två canonical versioner och generera versionsunderlag.
    script: scripts/diff_metamodel.py
    deterministic: true
    mutates_workspace: true
    runtime_fallback: manual
  - id: adapt-source-model
    type: script
    requirement: recommended
    purpose: Normalisera och applicera en godkänd källanpassningsplan.
    script: scripts/adapt_source_model.py
    deterministic: true
    mutates_workspace: true
    runtime_fallback: manual
  - id: validate-workspace
    type: script
    requirement: required
    purpose: Kontrollera att ett workspace kan återupptas.
    script: scripts/validate_workspace.py
    deterministic: true
    mutates_workspace: false
    runtime_fallback: manual
runtime:
  primary: none
  chat_zip:
    enabled: true
    start_here_template: templates/START-HERE.chat.md.tpl
  custom_gpt:
    enabled: false
  claude:
    enabled: true
    role: peer_distribution
    mode: claude_project
    project:
      instructions: project/instructions.md
      knowledge: project/knowledge
      runtime_contract: project/runtime-contract.json
    templates:
      readme: templates/README.claude.md.tpl
  opencode:
    enabled: true
    role: peer_distribution
    layout:
      instructions: AGENTS.md
      config: opencode.json
      tools: .opencode/tools
      runtime_scripts: scripts
      runtime_contract: .opencode/runtime-contract.json
      knowledge: knowledge
    templates:
      readme: templates/README.opencode.md.tpl
    project_instruction: AGENTS.md
    default_agent: metamodel-builder
    agent_file: .opencode/agents/metamodel-builder.md
    skills:
      enabled: true
      directory: .opencode/skills
    execution:
      python_scripts: embedded
      shell: local
      git: workspace_optional
  plugin:
    enabled: true
    role: peer_distribution
    mode: skills_first
    layout:
      manifest_file: plugin.json
      skills: skills
      references: references
      assets: assets
      scripts: scripts
    templates:
      readme: templates/README.plugin.md.tpl
    skill_id: metamodel-builder
    state_authority: workspace_file
    state_path: project-status.yaml
    compatibility:
      parity: equivalent_runtime_dependent
      writable_workspace: required
      persistent_state: required
      code_execution: required_for_full_parity
      shell: recommended
      sparx_ea: external_manual_verification
      mcp_required_for_script_resources: false
runtime_parity:
  registered_runtimes:
  - chatgpt_chat
  - claude_skills
  - claude_project
  - opencode
  - openai_plugin
  active_runtimes:
  - chatgpt_chat
  - claude_project
  - claude_skills
  - opencode
  - openai_plugin
  policy: docs/runtime-parity-v1.md
  validator: scripts/validate_runtime_parity.py
  required_equal_contracts:
  - capabilities
  - artifacts
  - workspace_state
  - tools
  allowed_execution_differences: true
build:
  build_chat_zip: true
  build_custom_gpt_zip: false
  build_claude_zip: true
  build_claude_project_zip: true
  build_claude_skills_zip: true
  build_opencode_zip: true
  build_plugin_zip: true
build_system:
  targets:
  - project
  - chat
  - claude_project
  - claude_skills
  - opencode
  - plugin
  runtime_targets:
    chat:
      runtime_id: chatgpt_chat
      runtime_key: chat_zip
      builder: chat
      artifact_type: chat_zip
      filename_pattern: <project-id>-chat-<version>.zip
    claude_project:
      runtime_id: claude_project
      runtime_key: claude
      builder: claude
      artifact_type: claude_project_zip
      filename_pattern: <project-id>-claude-project-<version>.zip
    claude_skills:
      runtime_id: claude_skills
      runtime_key: claude
      builder: claude_skills
      artifact_type: claude_skills_zip
      filename_pattern: <project-id>-claude-skills-<version>.zip
    opencode:
      runtime_id: opencode
      runtime_key: opencode
      builder: opencode
      artifact_type: opencode_zip
      filename_pattern: <project-id>-opencode-<version>.zip
    plugin:
      runtime_id: openai_plugin
      runtime_key: plugin
      builder: plugin
      artifact_type: plugin_zip
      filename_pattern: <project-id>-plugin-<version>.zip
testing:
  model_compatibility_dir: evals/model-compatibility
ci:
  enabled: true
  workflow: .github/workflows/gpt-byggaren-engine.yml
  runner: ubuntu-latest
  python: '3.12'
  validation_script: scripts/run_ci.py
  release_build_script: scripts/build_release.py
  artifact_directory: dist
release:
  github:
    enabled: true
    workflow: .github/workflows/release.yml
    tag_pattern: v*
    version_source: git_tag_without_v_prefix
    manual_build_supported: true
    required_artifacts:
    - project_package
    - chat_zip
    - claude_project_zip
    - claude_skills_zip
    - opencode_zip
    - plugin_zip
    - engine_zip
    - runtime_parity_report
    - release_manifest
    - sha256sums
    manual_gate: Sparx EA import fixture must be executed when an EA environment is
      available; automation must not claim it passed otherwise.
